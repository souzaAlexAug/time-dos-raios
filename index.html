<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O Mistério do Time dos Raios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: jogo em tela cheia (canvas) com interface sobreposta; visual único "escola + quadro-verde + caderno pautado + celular" */
:root {
  --quadro: #24493b;
  --giz: #f5f2e6;
  --sol: #ffc93c;
  --sol-escuro: #e0a915;
  --tinta: #1f2a44;
  --tinta-suave: #55607a;
  --papel: #fffdf6;
  --pauta: #c6dbef;
  --margem: #e27070;
  --ok: #2f9e62;
  --nao: #d24a4a;
  --roxo: #6c4fd1;
  --sombra: rgba(20, 28, 45, .28);
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-texto: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Courier New", monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: #6fa552; color: var(--tinta);
  font-family: var(--f-texto); font-size: 18px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
#jogo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }

.topo { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; padding: 10px 16px; pointer-events: none; z-index: 5; }
.objetivo { pointer-events: auto; background: var(--quadro); color: var(--giz); border: 3px solid #8a6a3f; border-radius: 10px; padding: 7px 12px; max-width: min(540px, 62vw); box-shadow: 0 4px 0 var(--sombra); min-width: 0; }
.objetivo small { display: block; font-family: var(--f-display); font-weight: 600; color: var(--sol); letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
.objetivo span { font-size: 15px; }
.acoes-topo { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
.btn-topo { background: var(--papel); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 10px; padding: 7px 12px; font-family: var(--f-display); font-weight: 600; font-size: 15px; box-shadow: 0 3px 0 var(--tinta); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-topo:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--tinta); }
.btn-topo .num { background: var(--sol); border-radius: 6px; padding: 0 6px; font-variant-numeric: tabular-nums; }

.avisos { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); transform: translateX(-50%); display: grid; gap: 6px; z-index: 30; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.aviso { background: var(--tinta); color: #fff; padding: 9px 14px; border-radius: 10px; font-family: var(--f-display); font-weight: 600; text-align: center; box-shadow: 0 4px 0 var(--sombra); animation: entra .25s ease-out; }
.aviso.pista { background: var(--ok); }
.aviso.erro { background: var(--nao); }
@keyframes entra { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

.interagir { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); background: var(--sol); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 999px; padding: 10px 20px; font-family: var(--f-display); font-weight: 700; font-size: 18px; box-shadow: 0 4px 0 var(--tinta); z-index: 6; max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.interagir kbd { background: var(--papel); border: 2px solid var(--tinta); border-radius: 6px; padding: 0 6px; margin-right: 6px; font-family: var(--f-display); }
.toque .interagir { left: auto; right: 16px; transform: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); padding: 16px 22px; }
.toque .interagir kbd { display: none; }
.joy { position: fixed; width: 120px; height: 120px; border-radius: 50%; background: rgba(31,42,68,.18); border: 3px solid rgba(31,42,68,.35); z-index: 4; pointer-events: none; transform: translate(-50%, -50%); }
.joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--papel); border: 3px solid var(--tinta); }
.dica-toque { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); background: rgba(255,253,246,.85); border-radius: 10px; padding: 6px 10px; font-size: 13px; z-index: 4; pointer-events: none; }

.dialogo { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(760px, calc(100% - 32px)); background: var(--quadro); color: var(--giz); border: 6px solid #8a6a3f; border-radius: 14px; padding: 14px 18px 16px; z-index: 10; box-shadow: 0 8px 0 var(--sombra), inset 0 0 40px rgba(0,0,0,.25); }
.dialogo .quem { font-family: var(--f-display); font-weight: 700; font-size: 21px; color: var(--sol); }
.dialogo .quem small { font-family: var(--f-texto); font-weight: 400; color: #bcd3c6; font-size: 14px; margin-left: 8px; }
.dialogo .fala { font-size: 21px; min-height: 3.2em; margin-top: 4px; }
.dialogo .seguir { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.btn-giz { background: transparent; color: var(--giz); border: 2px dashed rgba(245,242,230,.7); border-radius: 10px; padding: 6px 14px; font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.escolhas { display: grid; gap: 8px; margin-top: 10px; }
.escolha { text-align: left; background: var(--papel); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 10px; padding: 10px 14px; font-size: 16px; box-shadow: 0 3px 0 var(--tinta); }
.escolha:hover { background: #fff3c9; }

.fundo-modal { position: fixed; inset: 0; background: rgba(20,28,45,.55); z-index: 20; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.folha { width: min(760px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: var(--papel); border-radius: 14px; box-shadow: 0 10px 0 var(--sombra); position: relative; min-width: 0; background-image: linear-gradient(transparent 31px, var(--pauta) 32px); background-size: 100% 32px; padding: 20px 22px 20px 54px; }
.folha::before { content: ""; position: absolute; left: 38px; top: 0; bottom: 0; width: 2px; background: var(--margem); }
.folha h2 { font-family: var(--f-display); font-weight: 700; font-size: 27px; margin: 0 0 4px; line-height: 1.15; text-wrap: balance; }
.folha .sub { color: var(--tinta-suave); margin: 0 0 14px; }
.folha p { margin: 0 0 12px; }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.btn { background: var(--sol); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 10px; padding: 10px 18px; font-family: var(--f-display); font-weight: 700; font-size: 17px; box-shadow: 0 3px 0 var(--tinta); }
.btn.sec { background: var(--papel); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.nao { background: var(--nao); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--tinta); }
.rotulo { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-suave); margin: 0 0 6px; }
.explica { border-left: 4px solid var(--sol); background: #fff8dd; padding: 8px 12px; border-radius: 0 8px 8px 0; margin-top: 12px; }
.explica.bom { border-color: var(--ok); background: #e3f5ea; }
.explica.ruim { border-color: var(--nao); background: #fbe4e4; }
.selo-puzzle { display: inline-block; font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: var(--roxo); color: #fff; border-radius: 6px; padding: 2px 8px; margin-bottom: 6px; }

.capa { background: var(--quadro); color: var(--giz); background-image: none; padding: 26px 26px 22px; border: 8px solid #8a6a3f; }
.capa::before { display: none; }
.capa .selo { display: inline-block; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--quadro); background: var(--sol); border-radius: 6px; padding: 2px 8px; }
.capa h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 7vw, 54px); line-height: 1; margin: 12px 0 10px; text-wrap: balance; }
.capa h1 em { font-style: normal; color: var(--sol); }
.capa p { color: #dfe9e2; max-width: 62ch; }
.capa .controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 16px 0 4px; }
.capa .controles div { border: 2px dashed rgba(245,242,230,.5); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
.capa .controles b { font-family: var(--f-display); color: var(--sol); display: block; }

.pista { padding: 0 0 32px; position: relative; min-height: 64px; }
.pista h3 { font-family: var(--f-display); font-size: 19px; margin: 0; line-height: 32px; }
.pista p { margin: 0; line-height: 32px; }
.pista.falta { color: #8b93a6; }
.pista .n { position: absolute; left: -40px; top: 0; width: 28px; text-align: center; font-family: var(--f-display); font-weight: 700; color: var(--margem); line-height: 32px; }

/* fichas de palavras (frase) e de senha */
.frase-area { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 10px; border: 2px dashed var(--tinta-suave); border-radius: 10px; background: rgba(255,255,255,.75); align-content: flex-start; }
.frase-area .vazio { color: var(--tinta-suave); font-style: italic; }
.banco { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ficha { background: #fff3c9; border: 2px solid var(--tinta); border-radius: 8px; padding: 6px 12px; font-family: var(--f-display); font-weight: 600; font-size: 18px; box-shadow: 0 3px 0 var(--tinta); }
.ficha:nth-child(3n) { background: #d9ecff; }
.ficha:nth-child(3n+1) { background: #e3f5ea; }
.ficha.colocada { box-shadow: none; background: #fff; }
.ficha.certa { background: #d8f2e3; border-color: var(--ok); }

/* perfis */
.perfis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .perfis { grid-template-columns: 1fr; } }
.perfil { background: #fff; border: 2px solid var(--tinta); border-radius: 12px; padding: 12px; min-width: 0; }
.perfil .cab { display: flex; gap: 10px; align-items: center; }
.perfil .foto { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #f9a24b, #e0538b); display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 22px; flex: none; }
.perfil b { font-family: var(--f-display); display: block; overflow-wrap: anywhere; }
.perfil small { color: var(--tinta-suave); }
.perfil ul { margin: 8px 0 0; padding-left: 18px; font-size: 15px; }
.perfil .post { background: #f3f4f7; border-radius: 8px; padding: 6px 8px; margin-top: 6px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: #fff; border: 2px solid var(--tinta); border-radius: 999px; padding: 6px 12px; font-size: 15px; text-align: left; }
.chip[aria-pressed="true"] { background: var(--sol); }
.chip.certo { background: #d8f2e3; border-color: var(--ok); }
.chip.errado { background: #fbe0e0; border-color: var(--nao); }
.chip.faltou { border-style: dashed; border-color: var(--ok); }

/* caça-palavras */
.caca { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 14px; align-items: start; }
@media (max-width: 600px) { .caca { grid-template-columns: 1fr; } }
.grade { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; max-width: 440px; width: 100%; }
.cel { aspect-ratio: 1; border: 1.5px solid #b9c3d3; background: #fff; border-radius: 6px; font-family: var(--f-mono); font-weight: 600; font-size: clamp(13px, 3.4vw, 18px); padding: 0; display: grid; place-items: center; }
.cel.ini { background: var(--sol); border-color: var(--tinta); }
.cel.achada { background: #bfe8cf; border-color: var(--ok); }
.palavras { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.palavras li { font-family: var(--f-display); font-weight: 600; letter-spacing: .05em; }
.palavras li.ok { color: var(--ok); text-decoration: line-through; }

/* cadeado */
.charadas { margin: 0 0 12px; padding-left: 20px; }
.charadas li { margin-bottom: 6px; }
.cadeado { display: flex; justify-content: center; gap: 12px; padding: 14px; background: #2b2f3a; border-radius: 16px; width: fit-content; margin: 8px auto; border: 4px solid #8d93a3; }
.roda { display: grid; gap: 6px; justify-items: center; }
.roda button { background: #4a5163; color: #fff; border: 0; border-radius: 8px; width: 54px; height: 34px; font-size: 18px; }
.roda .dig { width: 54px; height: 64px; background: #f6f2e4; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 36px; color: var(--tinta); }
.roda .dig.certo { background: #bfe8cf; }
.treme { animation: treme .35s; }
@keyframes treme { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* senha */
.senha-saida { font-family: var(--f-mono); font-size: 24px; background: #20283a; color: #9be7a8; border-radius: 10px; padding: 12px 14px; min-height: 30px; overflow-wrap: anywhere; letter-spacing: .04em; }
.regras { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 4px; }
.regras li::before { content: "○ "; color: var(--tinta-suave); font-weight: 700; }
.regras li.ok { color: var(--ok); }
.regras li.ok::before { content: "✓ "; color: var(--ok); }
.regras li.proibido { color: var(--nao); }
.regras li.proibido::before { content: "✗ "; color: var(--nao); }

/* opções e provas */
.opcoes { display: grid; gap: 10px; }
.opcao { text-align: left; background: #fff; border: 2px solid var(--tinta); border-radius: 10px; padding: 12px 14px; font-size: 16px; box-shadow: 0 3px 0 var(--tinta); }
.opcao.certa { background: #d8f2e3; border-color: var(--ok); }
.opcao.errada { background: #fbe0e0; border-color: var(--nao); }
.provas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .provas { grid-template-columns: 1fr; } }
.prova { text-align: left; background: #fffaf0; border: 2px solid var(--tinta); border-radius: 10px; padding: 10px 12px; font-size: 15px; box-shadow: 0 3px 0 var(--tinta); position: relative; }
.prova[aria-pressed="true"] { background: var(--sol); }
.prova.certo { background: #d8f2e3; border-color: var(--ok); }
.prova.errado { background: #fbe0e0; border-color: var(--nao); }
.prova .tag { display: block; font-family: var(--f-display); font-size: 13px; font-weight: 700; margin-top: 4px; }
.progresso { display: flex; gap: 6px; margin-bottom: 10px; }
.progresso i { flex: 1; height: 8px; border-radius: 4px; background: #e2e5ec; }
.progresso i.feito { background: var(--sol-escuro); }

.certificado { text-align: center; border: 4px double var(--tinta); border-radius: 12px; padding: 18px 14px; background: #fff; margin: 6px 0 12px; }
.certificado .t { font-family: var(--f-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); }
.certificado .nome { font-family: var(--f-display); font-weight: 700; font-size: 30px; border-bottom: 2px solid var(--tinta); display: inline-block; min-width: 60%; padding: 0 10px; margin: 6px 0; overflow-wrap: anywhere; }
.certificado input { font: inherit; font-size: 16px; padding: 8px 10px; border: 2px solid var(--tinta); border-radius: 8px; width: min(320px, 100%); margin-top: 8px; }
.ajuda-box { background: var(--quadro); color: var(--giz); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
.ajuda-box b { color: var(--sol); font-family: var(--f-display); }
@media (max-width: 520px) {
  body { font-size: 16px; }
  .folha { padding: 16px 14px 16px 44px; }
  .folha::before { left: 30px; }
  .pista .n { left: -36px; }
  .dialogo .fala { font-size: 17px; }
  .objetivo { max-width: 100%; }
  .topo { flex-direction: column; }
  .avisos { top: calc(env(safe-area-inset-top, 0px) + 132px); }
}
.linha-selo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.btn-ouvir { background: #fff; border: 2px solid var(--roxo); color: var(--roxo); border-radius: 999px; padding: 3px 12px; font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.pergunta { font-size: 24px !important; }
.opcoes.grandes .opcao { font-size: 20px; padding: 14px 16px; }
.btn.grande { font-size: 20px; padding: 14px 10px; }
.frase-area.vertical, .banco.vertical { flex-direction: column; align-items: stretch; }
.banco.vertical .ficha, .frase-area.vertical .ficha { text-align: left; font-size: 17px; }
.chat { background: #e9e3d7; border-radius: 12px; overflow: hidden; border: 2px solid var(--tinta); }
.chat-topo { background: #3d5a99; color: #fff; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
.chat-topo .av { width: 36px; height: 36px; border-radius: 50%; background: var(--sol); color: var(--tinta); display: grid; place-items: center; font-size: 20px; }
.chat-topo b { font-family: var(--f-display); display: block; line-height: 1.1; }
.chat-topo small { opacity: .85; }
.chat-corpo { padding: 14px; display: grid; gap: 10px; min-height: 110px; max-height: 38vh; overflow-y: auto; }
.bolha { background: #fff; border-radius: 4px 12px 12px 12px; padding: 8px 12px; max-width: 88%; box-shadow: 0 1px 0 rgba(0,0,0,.12); justify-self: start; min-width: 0; }
.bolha .autor { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.bolha .txt { font-size: 19px; overflow-wrap: anywhere; }
.etq { display: inline-block; font-size: 14px; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-top: 4px; color: #fff; }
.etq.ajuda { background: var(--ok); }
.etq.machuca { background: var(--nao); }
.chat-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; background: #fff; border-top: 2px solid var(--tinta); min-height: 20px; }
.memoria { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto; }
@media (max-width: 520px) { .memoria { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.carta { aspect-ratio: 3 / 4; border: 3px solid var(--tinta); border-radius: 12px; background: var(--roxo); color: #fff; display: grid; place-items: center; align-content: center; gap: 4px; padding: 6px; box-shadow: 0 4px 0 var(--tinta); min-width: 0; }
.carta .verso { font-size: 34px; }
.carta.aberta { background: #fff; color: var(--tinta); }
.carta.par { background: #d8f2e3; border-color: var(--ok); }
.carta .icone { font-size: 34px; line-height: 1; }
.carta .legenda { font-family: var(--f-display); font-weight: 600; font-size: 14px; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .aviso, .treme { animation: none; } }
</style>
</head><body>

<canvas id="jogo" aria-label="Mapa da escola"></canvas>
<div class="topo">
  <div class="objetivo"><small>Próximo passo</small><span id="objetivoTexto">Comece a investigação</span></div>
  <div class="acoes-topo">
    <button class="btn-topo" id="btnCaderno" type="button">Caderno <span class="num" id="contPistas">0/6</span></button>
    <button class="btn-topo" id="btnSom" type="button" aria-pressed="true">Som: ligado</button>
    <button class="btn-topo" id="btnMenu" type="button">Menu</button>
  </div>
</div>
<div class="avisos" id="avisos" aria-live="polite"></div>
<button class="interagir" id="interagir" type="button" hidden><kbd>E</kbd><span id="interagirTexto">Conversar</span></button>
<div class="joy" id="joy" hidden><i id="joyBola"></i></div>
<div class="dica-toque" id="dicaToque" hidden>Arraste o dedo na tela para andar</div>
<div class="dialogo" id="dialogo" hidden role="dialog" aria-live="polite">
  <div class="quem" id="dlgQuem"></div>
  <div class="fala" id="dlgFala"></div>
  <div class="escolhas" id="dlgEscolhas"></div>
  <div class="seguir"><button class="btn-giz" id="dlgOuvir" type="button">🔊 Ouvir</button><button class="btn-giz" id="dlgSeguir" type="button">Continuar ▸</button></div>
</div>
<div id="modais"></div>

<script>
(() => {
"use strict";

/* ===================================================================

function sala(r) {
  const vao = 92;
  pisos.push({ x: r.x, y: r.y, w: r.w, h: r.h, tipo: r.piso });
  parede(r.x, r.y, r.w, T, "janela");
  parede(r.x, r.y, T, r.h);
  if (r.porta === "S") {
    const cx = r.x + r.w / 2;
    parede(r.x, r.y + r.h - T, cx - vao / 2 - r.x, T);
    parede(cx + vao / 2, r.y + r.h - T, r.x + r.w - (cx + vao / 2), T);
    parede(r.x + r.w - T, r.y, T, r.h);
    placas.push({ x: cx, y: r.y + r.h + 14, texto: r.nome });
  } else {
    const cy = r.y + r.h / 2;
    parede(r.x, r.y + r.h - T, r.w, T);
    parede(r.x + r.w - T, r.y, T, cy - vao / 2 - r.y);
    parede(r.x + r.w - T, cy + vao / 2, T, r.y + r.h - (cy + vao / 2));
    placas.push({ x: r.x + r.w + 62, y: cy - 58, texto: r.nome });
  }
}

function desenharPessoa(p, t, dir, andando) {
  const esc = p.adulto ? 1.12 : 0.95;
  const bob = andando ? Math.abs(Math.sin(t * 10)) * 2 : Math.sin(t * 2 + (p.x || 0)) * 0.8;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(esc, esc);
  ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(0, 0, 12, 5, 0, 0, 7); ctx.fill();
  ctx.translate(0, -bob);
  const costas = dir === "cima";
  const lado = dir === "esq" ? -1 : dir === "dir" ? 1 : 0;
  const pern = andando ? Math.sin(t * 12) * 3 : 0;
  ctx.fillStyle = p.calca; rr(-7, -12 + pern * 0.3, 6, 12, 2); ctx.fill(); rr(1, -12 - pern * 0.3, 6, 12, 2); ctx.fill();
  if (p.mochila && costas) { ctx.fillStyle = p.mochila; rr(-9, -30, 18, 16, 4); ctx.fill(); }
  ctx.fillStyle = p.camisa; rr(-10, -30, 20, 20, 6); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.stroke();
  ctx.fillStyle = p.adulto ? p.camisa : p.pele;
  rr(-14, -28, 5, 14, 2.5); ctx.fill(); rr(9, -28, 5, 14, 2.5); ctx.fill();
  ctx.fillStyle = p.pele; ctx.beginPath(); ctx.arc(-11.5, -13, 2.6, 0, 7); ctx.arc(11.5, -13, 2.6, 0, 7); ctx.fill();
  if (p.mochila && !costas) { ctx.fillStyle = p.mochila; ctx.fillRect(-8, -30, 3, 14); ctx.fillRect(5, -30, 3, 14); }
  if (p.gravata && !costas) { ctx.fillStyle = p.gravata; ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(3, -18); ctx.lineTo(0, -15); ctx.lineTo(-3, -18); ctx.closePath(); ctx.fill(); }
  if (p.cracha && !costas) { ctx.fillStyle = "#fff"; ctx.fillRect(2, -24, 6, 7); ctx.fillStyle = "#2f63b5"; ctx.fillRect(2, -24, 6, 2); }
  const cy = -41, cab = p.corCabelo;
  if (p.cabelo === "longo") { ctx.fillStyle = cab; rr(-12, cy - 6, 24, 24, 8); ctx.fill(); }
  if (p.cabelo === "rabo" && !costas) { ctx.fillStyle = cab; ctx.beginPath(); ctx.ellipse(lado >= 0 ? -12 : 12, cy + 4, 4, 9, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = p.pele; ctx.beginPath(); ctx.arc(0, cy, 11, 0, 7); ctx.fill();
  ctx.fillStyle = cab;
  if (costas) { ctx.beginPath(); ctx.arc(0, cy, 11.5, 0, 7); ctx.fill(); if (p.cabelo === "rabo") { ctx.beginPath(); ctx.ellipse(0, cy + 10, 4, 8, 0, 0, 7); ctx.fill(); } }
  else { ctx.beginPath(); ctx.arc(0, cy - 2, 11.6, Math.PI * 1.02, Math.PI * 1.98); ctx.fill(); ctx.fillRect(-11.5, cy - 4, 23, 3); }
  if (p.cabelo === "coque") { ctx.beginPath(); ctx.arc(0, cy - 13, 5.5, 0, 7); ctx.fill(); }
  if (p.cabelo === "espetado") { for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 6 - 4, cy - 9); ctx.lineTo(i * 6, cy - 17); ctx.lineTo(i * 6 + 4, cy - 9); ctx.fill(); } }
  if (p.touca) { ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(0, cy - 9, 12, 6, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(-12, cy - 10, 24, 3); }
  if (!costas) {
    const ox = lado * 3;
    if (p.triste) {
      ctx.strokeStyle = "#1d1d26"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ox - 6, cy + 2); ctx.lineTo(ox - 2, cy + 3); ctx.moveTo(ox + 2, cy + 3); ctx.lineTo(ox + 6, cy + 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(ox, cy + 9, 3, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.fillStyle = "#7fc4ff"; ctx.beginPath(); ctx.arc(ox - 5, cy + 6, 1.6, 0, 7); ctx.fill(); ctx.lineWidth = 1;
    } else {
      ctx.fillStyle = "#1d1d26"; ctx.beginPath(); ctx.arc(ox - 4, cy + 1, 1.8, 0, 7); ctx.arc(ox + 4, cy + 1, 1.8, 0, 7); ctx.fill();
      ctx.strokeStyle = "#1d1d26"; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(ox, cy + 4, 3, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke(); ctx.lineWidth = 1;
      ctx.fillStyle = "rgba(230,110,110,.35)"; ctx.beginPath(); ctx.arc(ox - 7, cy + 4, 2, 0, 7); ctx.arc(ox + 7, cy + 4, 2, 0, 7); ctx.fill();
    }

    function desenhar(certas) {

      el("p", {}, [el("b", { text: "Para professores: " }), "versão para 9 e 10 anos. Os 6 desafios trabalham empatia (reconhecer emoções), diferença entre mensagem gentil e mensagem que machuca, regras de ouro da internet, regras da turma, como uma piada cresce quando muitos entram junto e como pedir desculpas. O botão 🔊 lê as falas em voz alta. Nenhum dado do aluno é coletado: o progresso fica só neste navegador."]),

}
$("btnMenu").addEventListener("click", abrirMenu);
function recomecar() { estado.pistas.clear(); estado.concluido = false; salvar(); jogador.x = 800; jogador.y = 1040; jogador.dir = "cima"; atualizarHud(); aviso("Investigação reiniciada."); }

        f.append(el("div", { class: "explica " + (certo ? "bom" : "ruim") }, [el("b", { text: certo ? "Isso mesmo! " : "Não é bem assim. " }), q.explicacao]), rod);

        el("div", { class: "linha-botoes" }, [botao("Fechar", "sec", () => fechar(), { "data-fechar": "1" }), botao("Tentar de novo", "", () => { i = 0; acertos = 0; mostrar(); })]));

}

/* ===================================================================
   CONTROLES
   =================================================================== */
const teclas = new Set();
if (window.matchMedia("(pointer: coarse)").matches) { document.body.classList.add("toque"); $("dicaToque").hidden = false; }
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (e.target.tagName === "INPUT") return;
  if (!$("dialogo").hidden && (k === "e" || k === " " || k === "enter")) {
    if (!document.activeElement || !document.activeElement.classList.contains("escolha")) { e.preventDefault(); avancar(); }
    return;
  }
  if (ui.modal) { if (k === "escape") { const fs = $("modais").children; const u = fs[fs.length - 1]; const b = u && u.querySelector("[data-fechar]"); if (b) b.click(); } return; }
  if (["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)) { teclas.add(k); e.preventDefault(); }
  if ((k === "e" || k === " " || k === "enter") && alvoAtual && podeAndar()) { e.preventDefault(); interagir(); }
  if (k === "c" && podeAndar()) abrirCaderno(false);
});
window.addEventListener("keyup", e => teclas.delete(e.key.toLowerCase()));
window.addEventListener("blur", () => teclas.clear());

const joy = { ativo: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
cv.addEventListener("pointerdown", e => {
  if (!$("dialogo").hidden) { avancar(); return; }
  if (!podeAndar()) return;
  joy.ativo = true; joy.id = e.pointerId; joy.cx = e.clientX; joy.cy = e.clientY; joy.dx = joy.dy = 0;
  cv.setPointerCapture(e.pointerId);
  const j = $("joy"); j.style.left = e.clientX + "px"; j.style.top = e.clientY + "px"; j.hidden = false; $("joyBola").style.transform = "";
  $("dicaToque").hidden = true;
});
cv.addEventListener("pointermove", e => {
  if (!joy.ativo || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.cx, dy = e.clientY - joy.cy; const d = Math.hypot(dx, dy), max = 45;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  joy.dx = dx / max; joy.dy = dy / max; $("joyBola").style.transform = `translate(${dx}px, ${dy}px)`;
});
const soltar = e => { if (e.pointerId !== joy.id) return; joy.ativo = false; joy.dx = joy.dy = 0; $("joy").hidden = true; };
cv.addEventListener("pointerup", soltar); cv.addEventListener("pointercancel", soltar);
$("interagir").addEventListener("click", () => { if (alvoAtual && podeAndar()) interagir(); });

/* ===================================================================
   LAÇO DO JOGO
   =================================================================== */
let alvoAtual = null;
function interagir() { const a = alvoAtual; if (!a) return; $("interagir").hidden = true; conversar(a.id); }
function colide(x, y) { const r = { x: x - 8, y: y - 6, w: 16, h: 8 }; return solidos.some(s => r.x < s.x + s.w && r.x + r.w > s.x && r.y < s.y + s.h && r.y + r.h > s.y); }
function atualizar(dt) {
  let vx = 0, vy = 0;
  if (podeAndar()) {
    if (teclas.has("arrowleft") || teclas.has("a")) vx -= 1;
    if (teclas.has("arrowright") || teclas.has("d")) vx += 1;
    if (teclas.has("arrowup") || teclas.has("w")) vy -= 1;
    if (teclas.has("arrowdown") || teclas.has("s")) vy += 1;
    if (joy.ativo) { vx += joy.dx; vy += joy.dy; }
  }
  const mag = Math.hypot(vx, vy);
  jogador.andando = mag > 0.15;
  if (jogador.andando) {
    if (mag > 1) { vx /= mag; vy /= mag; }
    const vel = 170 * dt, nx = jogador.x + vx * vel, ny = jogador.y + vy * vel;
    if (!colide(nx, jogador.y)) jogador.x = nx;
    if (!colide(jogador.x, ny)) jogador.y = ny;
    jogador.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? "esq" : "dir") : (vy < 0 ? "cima" : "baixo");
  }
  let melhor = null, dmin = 70;
  for (const n of NPCS) { const d = Math.hypot(n.x - jogador.x, n.y - jogador.y); if (d < dmin) { dmin = d; melhor = n; } }
  alvoAtual = melhor;
  if (melhor && podeAndar()) { $("interagirTexto").textContent = (temNovidade(melhor.id) ? "Entrevistar " : "Conversar com ") + HIST.npcs[melhor.id].nome; $("interagir").hidden = false; }
  else $("interagir").hidden = true;
}
function desenhar(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#6fa552"; ctx.fillRect(0, 0, larg, alt);
  const vw = larg / zoom, vh = alt / zoom;
  let camX = jogador.x - vw / 2, camY = jogador.y - vh / 2 - 20;
  camX = vw >= MUNDO.w ? (MUNDO.w - vw) / 2 : Math.max(-20, Math.min(MUNDO.w - vw + 20, camX));
  camY = vh >= MUNDO.h ? (MUNDO.h - vh) / 2 : Math.max(-20, Math.min(MUNDO.h - vh + 20, camY));
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -camX * dpr * zoom, -camY * dpr * zoom);
  desenharPisos(); desenharMoveis(); desenharParedes();
  const lista = [];
  NPCS.forEach(n => lista.push({ y: n.y, f: () => desenharPessoa(n, t, n.olhar, false) }));
  altos.forEach(a => lista.push({ y: a.y, f: () => desenharArvore(a) }));
  lista.push({ y: jogador.y, f: () => desenharPessoa(Object.assign({ x: jogador.x, y: jogador.y }, JOGADOR_VISUAL), t, jogador.dir, jogador.andando) });
  lista.sort((a, b) => a.y - b.y).forEach(e => e.f());
  NPCS.forEach(n => {
    const topo = n.y - (n.adulto ? 64 : 58);
    desenharNome(HIST.npcs[n.id].nome, n.x, topo);
    if (!estado.concluido && temNovidade(n.id)) desenharMarcador(n.x, topo - 22, t, "!");
  });
  if (alvoAtual) { ctx.strokeStyle = "rgba(255,201,60,.9)"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.ellipse(alvoAtual.x, alvoAtual.y, 20, 8, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1; }
}
let ultimo = performance.now();
function quadro(agora) { const dt = Math.min(0.05, (agora - ultimo) / 1000); ultimo = agora; atualizar(dt); desenhar(agora / 1000); requestAnimationFrame(quadro); }

function iniciar(dados) {
  const salvo = (dados && Array.isArray(dados.pistas)) ? dados : carregarSalvo();
  if (salvo) { salvo.pistas.forEach(id => HIST.pistas[id] && estado.pistas.add(id)); estado.concluido = !!salvo.concluido; }
  if (dados && typeof dados.x === "number") { jogador.x = dados.x; jogador.y = dados.y; }
  atualizarHud(); requestAnimationFrame(quadro);
  if (!dados || typeof dados.x !== "number") abrirCapa();
}
try { window.claude?.hot?.snapshot?.(() => ({ pistas: [...estado.pistas], concluido: estado.concluido, x: jogador.x, y: jogador.y })); } catch (e) {}
const comecar = () => { const h = window.claude?.hot; if (h?.ready) h.ready(iniciar); else iniciar(h?.data); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(comecar, comecar);
})();
